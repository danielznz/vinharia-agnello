<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário | Vinharia Agnello</title>
    <link rel="stylesheet" href="../src/css/contato.css" />
    <link rel="stylesheet" href="../src/css/style.css" />
  </head>

  <body>
    <div class="divform">
      <form class="formulario">
        <header class="cabecalho">
          <h1>Entre em contato com a Vinharia Agnello!</h1>
        </header>
        <label for="nameuser">Nome completo</label>
        <input
          class="inputuser"
          type="text"
          name="nameuser"
          placeholder="Ex: João da Silva"
          required
        />
        <br />
        <label for="emailuser">Seu melhor e-mail</label>
        <input
          class="inputuser"
          type="email"
          name="emailuser"
          placeholder="Ex: joao@email.com"
          required
        />
        <br /><br />
        <label class="imputuser" for="messageuser">
          Digite o assunto que gostaria de tratar conosco...
        </label>
        <textarea
          class="boxtext"
          name="mensagem"
          cols="30"
          rows="10"
          placeholder="Digite aqui sua mensagem..."
          required
        ></textarea>
        <br />
        <button class="botaoenviar" type="submit">Enviar</button>
      </form>
    </div>
    <section class="botoes">
      <a class="botao" href="../../index.html">Início</a>
      <a class="botao" href="./produtos.html">Produtos</a>
      <a class="botao" href="./sobre.html">Sobre</a>
      <a class="botao" href="./equipe.html">Equipe</a>
      <a class="botao" href="#">Contatos</a>
    </section>
  </body>
</html>
